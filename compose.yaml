services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: dalel
      POSTGRES_USER: dalel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dalel_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dalel -d dalel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
