<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контроль кассовой дисциплины</title>
<style>
  :root { --bg:#0f1419; --card:#1a212b; --line:#2b3544; --text:#e6edf3; --muted:#8b98a8;
          --ok:#2ea66a; --bad:#e5534b; --accent:#4c8dff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 36px 16px; text-align: center;
          background: var(--card); cursor: pointer; transition: border-color .15s; }
  .drop.over, .drop:hover { border-color: var(--accent); }
  .drop strong { display:block; font-size:17px; margin-bottom:4px; }
  .drop span { color: var(--muted); font-size: 14px; }
  .hidden { display: none !important; }
  .status { margin-top: 20px; background: var(--card); border:1px solid var(--line); border-radius: 12px; padding: 16px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 10px; }
  .bar i { display:block; height:100%; width:0; background: var(--accent); transition: width .4s; }
  .verdict { margin-top: 20px; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: 600; }
  .verdict.ok { background: rgba(46,166,106,.15); border:1px solid var(--ok); }
  .verdict.bad { background: rgba(229,83,75,.15); border:1px solid var(--bad); }
  .note { color: var(--muted); font-size: 13px; font-weight: 400; margin-top: 4px; }
  .viol { margin-top: 16px; background: var(--card); border:1px solid var(--line); border-radius: 12px; padding: 16px; }
  .viol h3 { margin: 0 0 4px; font-size: 17px; }
  .tc { display:inline-block; background: var(--line); border-radius: 6px; padding: 1px 8px; font-size: 13px; margin-bottom: 8px; }
  .rule { margin-top: 8px; color: var(--muted); font-size: 14px; }
  .frames { display:flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .frames figure { margin:0; flex: 1 1 240px; }
  .frames img { width:100%; border-radius: 8px; border:1px solid var(--line); display:block; }
  .frames figcaption { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .err { margin-top: 20px; padding: 16px; border-radius: 12px; border:1px solid var(--bad); background: rgba(229,83,75,.1); }
  button { background: var(--accent); color:#fff; border:0; border-radius: 8px; padding: 8px 16px; font-size: 15px; cursor:pointer; margin-top: 12px; }
  .live { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .live-top { display:flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
  .live-top img { max-width: 100%; width: 300px; border-radius: 8px; border:1px solid var(--line); display:block; }
  .live-now { flex: 1 1 220px; font-size: 13px; }
  .live-now .t { color: var(--muted); margin-bottom: 4px; }
  .chip { display:inline-block; border-radius: 6px; padding: 1px 7px; margin: 0 4px 4px 0; background: var(--line); color: var(--muted); }
  .chip.y { background: rgba(46,166,106,.25); color: var(--text); border: 1px solid var(--ok); }
  .live-ev { margin-top: 8px; }
  .live-ev .chip { background: rgba(229,83,75,.18); color: var(--text); border:1px solid var(--bad); }
  .lgrid { overflow-x: auto; margin-top: 10px; }
  .lgrid table { border-collapse: collapse; font-size: 11px; }
  .lgrid th { text-align: right; font-weight: 400; color: var(--muted); padding-right: 6px; white-space: nowrap; }
  .lgrid td { width: 12px; height: 12px; padding: 0; border: 1px solid var(--bg); }
  .lgrid td.y { background: var(--ok); } .lgrid td.n { background: var(--line); } .lgrid td.u { background: #b08800; }
  .lgrid td.ev { background: var(--bad); }
  .live-note { color: var(--muted); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>Контроль кассовой дисциплины по видео</h1>
  <p class="sub">Загрузите запись с камеры над кассой. Результат это подсказка для проверки человеком, а не окончательное заключение.</p>

  <label id="drop" class="drop">
    <strong>Выберите .mov или перетащите файл сюда</strong>
    <span>Исходное видео хранится на сервере; выбранные кадры обрабатывает модель команды</span>
    <input id="file" type="file" accept=".mov,.mp4,.m4v,video/quicktime,video/mp4" class="hidden">
  </label>

  <div id="status" class="status hidden">
    <div id="stage">Загрузка…</div>
    <div class="bar"><i id="bar"></i></div>
    <div id="live" class="live hidden">
      <div class="live-top">
        <img id="live-img" alt="Что сейчас видит модель">
        <div class="live-now">
          <div class="t" id="live-t"></div>
          <div id="live-ans"></div>
          <div class="live-ev" id="live-ev"></div>
        </div>
      </div>
      <div class="lgrid" id="live-grid"></div>
      <div class="live-note">Живой просмотр: фрагмент кадра, который получила модель, и её ответы. Найденное до конца анализа — предварительно.</div>
    </div>
  </div>
  <div id="result"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const drop = $("drop"), fileInput = $("file"), statusBox = $("status"), result = $("result");

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function setStage(text, frac) {
  statusBox.classList.remove("hidden");
  $("stage").textContent = text;
  $("bar").style.width = Math.round((frac || 0) * 100) + "%";
}
function fmt(sec) {
  const m = Math.floor(sec / 60), s = (sec % 60).toFixed(1).padStart(4, "0");
  return m + ":" + s;
}
function showError(msg) {
  statusBox.classList.add("hidden");
  const box = el("div", "err", msg);
  const again = el("button", null, "Попробовать ещё раз");
  again.onclick = reset;
  box.append(document.createElement("br"), again);
  result.replaceChildren(box);
}
function reset() { result.replaceChildren(); statusBox.classList.add("hidden"); fileInput.value = ""; drop.classList.remove("hidden"); }

function render(data) {
  statusBox.classList.add("hidden");
  const nodes = [];
  const bad = data.verdict === "violation";
  const v = el("div", "verdict " + (bad ? "bad" : "ok"),
    bad ? "Обнаружены признаки возможных нарушений" : "Нарушение не обнаружено");
  v.append(el("div", "note", "Результат требует проверки человеком."));
  nodes.push(v);
  for (const item of data.violations) {
    const card = el("div", "viol");
    card.append(el("h3", null, item.type), el("span", "tc", "Таймкод " + fmt(item.timecode_sec)),
                el("div", null, item.description));
    if (item.rule) {
      const sec = item.rule.section ? ", " + item.rule.section : "";
      card.append(el("div", "rule", "Источник: " + item.rule.document + sec));
    }
    const frames = el("div", "frames");
    for (const fr of item.evidence_frames) {
      const fig = el("figure"), img = new Image();
      img.src = "data:image/jpeg;base64," + fr.image_base64;
      img.alt = "Кадр на " + fmt(fr.timestamp_sec);
      fig.append(img, el("figcaption", null, "Кадр на " + fmt(fr.timestamp_sec)));
      frames.append(fig);
    }
    card.append(frames);
    nodes.push(card);
  }
  const again = el("button", null, "Проверить другое видео");
  again.onclick = reset;
  nodes.push(again);
  result.replaceChildren(...nodes);
}

// ---- живой просмотр: что модель видит и отвечает по кадрам ----
const live = { rows: [], probes: [], events: [] };
function resetLive() { live.rows = []; live.probes = []; live.events = []; $("live").classList.add("hidden"); }

function drawLive(d) {
  if (!d.active) return;
  live.probes = d.probes;
  live.rows = live.rows.concat(d.rows).sort((a, b) => a.t - b.t);
  live.events = d.events;
  $("live").classList.remove("hidden");
  if (d.preview) $("live-img").src = "data:image/jpeg;base64," + d.preview;
  const last = live.rows.find((r) => r.t === d.preview_t) || live.rows[live.rows.length - 1];
  $("live-t").textContent = last ? "Кадр " + fmt(last.t) + " · проанализировано кадров: " + live.rows.length : "";
  const ans = $("live-ans"); ans.replaceChildren();
  if (last) for (const p of live.probes) {
    const a = last.a[p.id];
    if (a === undefined) continue;
    ans.append(el("span", "chip" + (a === "yes" ? " y" : ""), p.title + (a === "yes" ? " ✓" : "")));
  }
  const ev = $("live-ev"); ev.replaceChildren();
  for (const e of live.events) ev.append(el("span", "chip", fmt(e.t) + " " + e.type));
  // сетка «вопрос × кадр»
  const evTimes = live.events.map((e) => e.t);
  const tbl = document.createElement("table");
  const top = document.createElement("tr");
  top.append(el("th", null, ""));
  for (const r of live.rows) {
    const c = document.createElement("td");
    if (evTimes.some((t) => Math.abs(t - r.t) < 0.6)) c.className = "ev";
    c.title = fmt(r.t);
    top.append(c);
  }
  tbl.append(top);
  for (const p of live.probes) {
    const tr = document.createElement("tr");
    tr.append(el("th", null, p.title));
    for (const r of live.rows) {
      const a = r.a[p.id], c = document.createElement("td");
      c.className = a === "yes" ? "y" : a === "no" ? "n" : a === "unclear" ? "u" : "";
      c.title = fmt(r.t) + " — " + p.title + ": " + (a || "не спрашивали");
      tr.append(c);
    }
    tbl.append(tr);
  }
  $("live-grid").replaceChildren(tbl);
}

async function poll(jobId) {
  resetLive();
  for (;;) {
    await new Promise((r) => setTimeout(r, 1500));
    let res;
    try { res = await fetch("/ui/jobs/" + jobId); } catch { continue; }
    if (!res.ok) return showError("Ошибка сервера: " + res.status);
    const data = await res.json();
    if (data.status === "processing") {
      setStage(data.stage || "Обработка…", data.progress || 0);
      try {
        const lr = await fetch("/ui/jobs/" + jobId + "/live?since=" + live.rows.length);
        if (lr.ok) drawLive(await lr.json());
      } catch {}
    }
    else if (data.status === "failed") return showError("Не удалось обработать видео: " + data.error);
    else { resetLive(); return render(data); }
  }
}

async function upload(file) {
  if (!file) return;
  result.replaceChildren();
  drop.classList.add("hidden");
  setStage("Загрузка файла…", 0.01);
  const form = new FormData();
  form.append("file", file);
  let res;
  try { res = await fetch("/ui/analyze", { method: "POST", body: form }); }
  catch { return showError("Не удалось связаться с сервером."); }
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).detail; } catch {}
    return showError("Файл не принят: " + (detail || res.status));
  }
  poll((await res.json()).job_id);
}

fileInput.addEventListener("change", () => upload(fileInput.files[0]));
for (const ev of ["dragenter", "dragover"]) drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); });
for (const ev of ["dragleave", "drop"]) drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); });
drop.addEventListener("drop", (e) => upload(e.dataTransfer.files[0]));
</script>
</body>
</html>
