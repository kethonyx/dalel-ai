# Пороги модуля трекинга (pipeline/ingest.py, tracking.py, events.py).
# Значения общие для всех роликов: под отдельные ролики не подгоняются.

ingest:
  fps: 5                      # кадров в секунду для анализа; время кадра — из PTS контейнера

detector:
  model: PekingU/rtdetr_r50vd # Apache-2.0, веса из кэша HF (после загрузки работает без интернета)
  score_threshold: 0.25       # низкий: слабые детекции ByteTrack использует во втором проходе
  batch_size: 8
  device: auto                # auto | cuda | mps | cpu

tracker:                      # supervision.ByteTrack
  frame_rate: 5               # = ingest.fps
  track_activation_threshold: 0.4
  lost_track_buffer: 15       # кадров (3 с при 5 fps) держать потерянный трек
  minimum_matching_threshold: 0.8
  minimum_consecutive_frames: 2

tracks:
  min_track_score: 0.5        # трек «подтверждён», если средний score не ниже: отсекает стулья и людей
                              # за стеклом и отражения (этап 1: у них 0,29–0,47, редко до 0,67)

cashier:
  init_sec: 5                 # окно с первого появления людей, где выбирается кассир
  motion_penalty: 5.0         # штраф за подвижность: доля кадров в окне × средний score − penalty × смещение
  stitch_sec: 1.0             # новый трек — продолжение кассира, если начался не позже чем через столько
  stitch_dist: 0.5            #   и не дальше этой доли высоты рамки от места, где трек кассира оборвался

zone:
  init_sec: 5                 # медианный bbox кассира за самое неподвижное окно такой длины
  search_sec: 20              #   в первых search_sec секундах (кассир может сначала входить в кабинет)
  expand: 1.5                 # во сколько раз расширить bbox кассира
  iou_threshold: 0.3          # человек в зоне: центр bbox внутри зоны или IoU выше порога

events:
  fill_gap_sec: 2.0           # провалы занятости короче — заполнять (наклон, перекрытие)
  min_absence_sec: 2.0        # departure — если зона пуста дольше этого
  end_absence_sec: 1.0        #   а если пусто до конца ролика — достаточно столько (ролик могли обрезать)
  min_presence_sec: 2.0       # уход считается только после того, как кассир хоть раз пробыл в зоне
                              #   непрерывно столько (иначе проход через зону в начале — ложный уход)
  intrusion_min_sec: 0.6      # чужой трек в зоне без кассира дольше этого
  entry_min_sec: 2.0          # entry: новый подтверждённый трек (не кассир) виден хотя бы столько
                              #   (прохожие за стеклом и отражения короче: этап 2, X-20 — 1 с);
                              #   кандидат для VLM (дверь, кто вошёл), а не вердикт: клиенты тоже входят
  entry_after_sec: 1.0        # трек, начавшийся раньше, — человек был в кадре с начала ролика, а не вошёл
                              #   (ByteTrack подтверждает трек со 2-го кадра, «появление» сдвигается на 0,2 с)
